name: Build and Upload

on:
  push:
    branches:
      - main

concurrency:
  group: drop-production
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install Dependencies
        run: npm ci

      - name: Validate Developer API
        run: npm run test:developer

      - name: Build
        run: npm run build

      - name: Upload Dist
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SERVER_KEY }}
          source: ".output/*"
          target: "/sdb/drop.micropue.com.cn"
          strip_components: 1
          rm: true

      - name: Migrate and Restart
        uses: appleboy/ssh-action@v1.2.0
        env:
          SERVER_RESTART_COMMAND: ${{ secrets.SERVER_RESTART_COMMAND }}
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SERVER_KEY }}
          envs: SERVER_RESTART_COMMAND
          script: |
            set -eu
            cd /sdb/drop.micropue.com.cn
            node --env-file-if-exists=/sdb/drop.micropue.com.cn.env server/migrate.mjs
            restart_command="${SERVER_RESTART_COMMAND:-sudo systemctl restart drop}"
            sh -lc "$restart_command"

            port="$(sed -n 's/^PORT=//p' /sdb/drop.micropue.com.cn.env 2>/dev/null | tail -n 1)"
            port="${port:-3000}"
            attempt=0
            while [ "$attempt" -lt 15 ]; do
              attempt=$((attempt + 1))
              if curl -fsS "http://127.0.0.1:${port}/api/health" | grep -q '"status":"ok"'; then
                echo "Health check passed on port ${port}."
                exit 0
              fi
              sleep 2
            done
            echo "Health check failed on port ${port}." >&2
            exit 1
